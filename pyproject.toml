[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqtp"
version = "0.1.0"
description = "Adaptive Quantitative Trading Platform for Indian F&O markets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "requests>=2.31",
    "typer>=0.9",
    "rich>=13.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
aqtp = "aqtp.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
